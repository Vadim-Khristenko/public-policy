[package]
name = "avrora"
version = "0.1.0"
edition = "2024"
authors = ["AVRORA <avrora@vai-prog.ru>"]
license = "MIT"
description = "High-performance policy-as-code compliance engine for website privacy analysis."

[[bin]]
name = "avrora"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
crossterm = "0.29"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
url = { version = "2.5", features = ["serde"] }
